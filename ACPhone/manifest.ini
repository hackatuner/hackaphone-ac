[ABOUT]
NAME = HackaPhone
AUTHOR = smartnajeeri
VERSION = 1.1.3
DESCRIPTION = iPhone-style phone: lock screen, Control Centre, live notifications, Live Activities, Messages, Maps, Camera, Walk, Video, Chase Cam, Livery, Plates, Skins, HUD, Weather and more.
REQUIRED_VERSION = 0

[CORE]
; keep running all session so messages, plates, skins and cameras work while the phone is closed
LAZY = NONE

[WINDOW_...]
ID = main
NAME = HackaPhone
ICON = icon.png
FUNCTION_MAIN = windowMain
PADDING = 0, 0
SIZE = 372, 776
MIN_SIZE = 372, 776
MAX_SIZE = 372, 776
FLAGS = MAIN, NO_BACKGROUND, NO_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[SIM_CALLBACKS]
FRAME_BEGIN = camUpdate

[WINDOW_...]
ID = actionbar
NAME = HackaPhone Action Bar
ICON = icon.png
FUNCTION_MAIN = actionBar
PADDING = 0, 0
SIZE = 560, 180
FLAGS = NO_BACKGROUND, NO_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
